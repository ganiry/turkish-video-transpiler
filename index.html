<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Captions</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e3e1dc; --accent: #2f6fdb; --accent-soft: #e6eefc; --cue-bg: rgba(0,0,0,.72);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --surface: #1d1d20; --text: #ececee; --muted: #9a9aa2;
            --border: #2e2e33; --accent: #6d9cf0; --accent-soft: #1f2a40; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; }
  select, button { font: inherit; color: var(--text); background: var(--surface);
                   border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
          padding: 3px 12px; font-size: 13px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .stage { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  video { width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; flex-direction: column;
             align-items: center; gap: 4px; pointer-events: none; padding: 0 5%; }
  .overlay span { background: var(--cue-bg); color: #fff; padding: 2px 10px; border-radius: 4px;
                  text-align: center; font-size: clamp(13px, 2.2vw, 20px); }
  .overlay span.secondary { color: #ffd76a; font-size: clamp(12px, 1.9vw, 17px); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .toggles label { display: flex; gap: 6px; align-items: center; background: var(--surface);
                   border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .toggles .dl { margin-left: auto; display: flex; gap: 10px; font-size: 13px; color: var(--muted); }
  .toggles a { color: var(--accent); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
           display: flex; flex-direction: column; min-height: 0; max-height: 72vh; }
  .panel h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border);
              display: flex; justify-content: space-between; }
  .panel h2 small { color: var(--muted); font-weight: 400; }
  .cues { overflow-y: auto; padding: 6px; }
  .cue { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .cue:hover { background: var(--accent-soft); }
  .cue.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .cue time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .cue .tr { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  code { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Auto Captions <span style="color:var(--muted);font-weight:400">· Whisper</span></h1>
    <select id="picker" aria-label="Video"></select>
  </header>
  <div class="meta" id="meta"></div>
  <div class="layout" id="layout">
    <div>
      <div class="stage">
        <video id="video" controls playsinline></video>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="toggles" id="toggles"></div>
    </div>
    <section class="panel">
      <h2>Transcript <small id="count"></small></h2>
      <div class="cues" id="cues"></div>
    </section>
  </div>
</main>

<script src="captions/manifest.js"></script>
<script>
const entries = window.CAPTIONS || [];
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay");
let current, shown = new Set(), lastActive = -1;

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const cueAt = (track, t) => track.cues.find(c => t >= c.start && t < c.end);

if (!entries.length) {
  $("layout").innerHTML = `<div class="empty">No captioned videos yet. Run
    <code>python caption.py &lt;video, link, or links.txt&gt;</code></div>`;
} else {
  entries.forEach((e, i) => $("picker").add(new Option(e.id, i)));
  $("picker").onchange = () => load(entries[$("picker").value]);
  load(entries[entries.length - 1]);
  $("picker").value = entries.length - 1;
}

function load(entry) {
  current = entry;
  shown = new Set(entry.tracks.map(t => t.lang));
  video.querySelectorAll("track").forEach(t => t.remove());
  video.src = entry.video;

  // Native tracks too (via blob URLs, so it works from file://) — used for fullscreen + accessibility
  entry.tracks.forEach((t, i) => {
    const vtt = "WEBVTT\n\n" + t.cues.map(c => `${vttTime(c.start)} --> ${vttTime(c.end)}\n${c.text}`).join("\n\n");
    const el = Object.assign(document.createElement("track"), {
      kind: t.kind, srclang: t.lang, label: t.label,
      src: URL.createObjectURL(new Blob([vtt], { type: "text/vtt" })),
    });
    video.appendChild(el);
    el.track.mode = "hidden"; // our overlay shows both languages at once; native cues only in fullscreen
  });

  const src = entry.tracks[0];
  $("meta").innerHTML = [
    ["Detected language", `${src.label} (${src.lang})`],
    ["Confidence", `${Math.round(entry.confidence * 100)}%`],
    ["Duration", fmt(entry.duration)],
    ["Model", entry.model],
    ["Processing time", `${entry.processing_seconds}s`],
  ].map(([k, v]) => `<span class="chip">${k}: <b>${esc(v)}</b></span>`).join("");

  $("toggles").innerHTML = entry.tracks.map(t =>
    `<label><input type="checkbox" data-lang="${t.lang}" checked> ${esc(t.label)}</label>`).join("") +
    `<span class="dl">Download: ${entry.tracks.map(t => `<a href="${t.src}" download>${t.lang}.vtt</a>`).join("")}</span>`;
  $("toggles").querySelectorAll("input").forEach(cb => cb.onchange = () => {
    cb.checked ? shown.add(cb.dataset.lang) : shown.delete(cb.dataset.lang);
    render();
  });

  // Transcript: source-language cues, each with the overlapping translation underneath
  const tr = entry.tracks[1];
  $("count").textContent = `${src.cues.length} cues`;
  $("cues").innerHTML = src.cues.map((c, i) => {
    const mid = (c.start + c.end) / 2;
    const t = tr && cueAt(tr, mid);
    return `<div class="cue" data-i="${i}" data-start="${c.start}"><time>${fmt(c.start)}</time>
      <div>${esc(c.text)}${t ? `<span class="tr">${esc(t.text)}</span>` : ""}</div></div>`;
  }).join("");
  $("cues").querySelectorAll(".cue").forEach(el =>
    el.onclick = () => { video.currentTime = +el.dataset.start + 0.01; video.play(); });
  render();
}

function vttTime(t) {
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = (t % 60).toFixed(3).padStart(6, "0");
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${s}`;
}

function render() {
  if (!current) return;
  const t = video.currentTime;
  overlay.innerHTML = current.tracks.filter(tr => shown.has(tr.lang)).map((tr, i) => {
    const c = cueAt(tr, t);
    return c ? `<span class="${i ? "secondary" : ""}">${esc(c.text)}</span>` : "";
  }).join("");

  const idx = current.tracks[0].cues.findIndex(c => t >= c.start && t < c.end);
  if (idx !== lastActive) {
    $("cues").querySelector(".active")?.classList.remove("active");
    const el = $("cues").querySelector(`[data-i="${idx}"]`);
    if (el) { el.classList.add("active"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    lastActive = idx;
  }
}
video.addEventListener("timeupdate", render);
video.addEventListener("seeked", render);
// The overlay can't follow the <video> into native fullscreen, so switch on its built-in captions there
document.addEventListener("fullscreenchange", () => {
  const fs = document.fullscreenElement === video;
  const first = current?.tracks.findIndex(t => shown.has(t.lang));
  [...video.textTracks].forEach((tt, i) => tt.mode = fs && i === first ? "showing" : "hidden");
});
</script>
</body>
</html>
